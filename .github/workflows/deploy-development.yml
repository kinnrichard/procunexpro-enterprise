name: Deploy Development
run-name: "DEV: ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: deploy-development
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/kinnrichard/procunexpro-enterprise/api
  WEB_IMAGE: ghcr.io/kinnrichard/procunexpro-enterprise/web
  IMAGE_TAG: development

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: development
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}-${{ github.sha }}
          cache-from: type=gha,scope=api-development
          cache-to: type=gha,mode=max,scope=api-development

      - name: Build & push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}-${{ github.sha }}
          cache-from: type=gha,scope=web-development
          cache-to: type=gha,mode=max,scope=web-development
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 12
    environment: development
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 167.71.214.238
          username: root
          key: ${{ secrets.DENTRO_SSH_KEY }}
          script: |
            set -e
            cd /root/procunex-development
            docker compose -f docker-compose.prod.yml --env-file .env pull
            # Apply the Prisma schema to the DB (project uses db push, not migrations)
            docker compose -f docker-compose.prod.yml --env-file .env run --rm api npx prisma db push --skip-generate || true
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
            docker image prune -af --filter "until=72h" || true
            sleep 8
            docker compose -f docker-compose.prod.yml --env-file .env ps
            echo "Development deploy complete."
