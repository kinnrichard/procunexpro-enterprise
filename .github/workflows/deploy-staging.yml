name: Deploy Staging
run-name: "STAGING: ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/kinnrichard/procunexpro-enterprise/api
  WEB_IMAGE: ghcr.io/kinnrichard/procunexpro-enterprise/web
  IMAGE_TAG: staging

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}-${{ github.sha }}
          cache-from: type=gha,scope=api-staging
          cache-to: type=gha,mode=max,scope=api-staging

      - name: Build & push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}-${{ github.sha }}
          cache-from: type=gha,scope=web-staging
          cache-to: type=gha,mode=max,scope=web-staging
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 12
    environment: staging
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 167.71.214.238
          username: root
          key: ${{ secrets.DENTRO_SSH_KEY }}
          script: |
            set -e
            cd /root/procunex-staging
            docker compose -f docker-compose.prod.yml --env-file .env pull
            # Custom roles: safe-cast the role enum -> text before db push (idempotent; Prisma won't auto-cast).
            docker compose -f docker-compose.prod.yml --env-file .env up -d postgres && sleep 4
            docker compose -f docker-compose.prod.yml --env-file .env exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "ALTER TABLE \"User\" ALTER COLUMN \"role\" DROP DEFAULT; ALTER TABLE \"User\" ALTER COLUMN \"role\" TYPE text USING \"role\"::text; ALTER TABLE \"ApprovalWorkflowRule\" ALTER COLUMN \"role\" TYPE text USING \"role\"::text; ALTER TABLE \"ApprovalStep\" ALTER COLUMN \"role\" TYPE text USING \"role\"::text; DROP TYPE IF EXISTS \"Role\";"' || true
            docker compose -f docker-compose.prod.yml --env-file .env run --rm api npx prisma db push --skip-generate || true
            # Ensure the DashboardWidget table exists even if db push was blocked by pre-existing drift (idempotent, additive-only).
            docker compose -f docker-compose.prod.yml --env-file .env exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE TABLE IF NOT EXISTS \"DashboardWidget\" (\"id\" text NOT NULL, \"tenantId\" text NOT NULL, \"type\" text NOT NULL, \"title\" text, \"config\" jsonb, \"allowedRoles\" text[] DEFAULT ARRAY[]::text[], \"x\" integer NOT NULL DEFAULT 0, \"y\" integer NOT NULL DEFAULT 0, \"w\" integer NOT NULL DEFAULT 3, \"h\" integer NOT NULL DEFAULT 2, \"isActive\" boolean NOT NULL DEFAULT true, \"createdAt\" timestamp(3) without time zone NOT NULL DEFAULT CURRENT_TIMESTAMP, \"updatedAt\" timestamp(3) without time zone NOT NULL, CONSTRAINT \"DashboardWidget_pkey\" PRIMARY KEY (\"id\"), CONSTRAINT \"DashboardWidget_tenantId_fkey\" FOREIGN KEY (\"tenantId\") REFERENCES \"Tenant\"(\"id\") ON UPDATE CASCADE ON DELETE RESTRICT); CREATE INDEX IF NOT EXISTS \"DashboardWidget_tenantId_idx\" ON \"DashboardWidget\"(\"tenantId\");"' || true
            # Additive columns for stock movement / lot manufacturing & expiry dates (idempotent; db push may skip these due to pre-existing drift).
            docker compose -f docker-compose.prod.yml --env-file .env exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "ALTER TABLE \"StockMovement\" ADD COLUMN IF NOT EXISTS \"manufactureDate\" timestamp(3); ALTER TABLE \"StockMovement\" ADD COLUMN IF NOT EXISTS \"expiryDate\" timestamp(3); ALTER TABLE \"StockMovement\" ADD COLUMN IF NOT EXISTS \"fromAreaId\" text; ALTER TABLE \"StockMovement\" ADD COLUMN IF NOT EXISTS \"toAreaId\" text; ALTER TABLE \"StockLot\" ADD COLUMN IF NOT EXISTS \"manufactureDate\" timestamp(3);"' || true
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
            docker image prune -af --filter "until=72h" || true
            sleep 8
            docker compose -f docker-compose.prod.yml --env-file .env ps
            echo "Staging deploy complete."
